<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c6bc0"/>
      <stop offset="100%" stop-color="#26c6da"/>
    </linearGradient>
  </defs>
  <!-- Icon block -->
  <g transform="translate(0, 0)">
    <rect width="40" height="40" rx="8" fill="url(#logo-grad)" opacity="0.18"/>
    <rect width="40" height="40" rx="8" fill="url(#logo-grad)" opacity="0.12"/>
    <!-- Helix strand A -->
    <path d="M8 8 Q20 13 32 8 M8 14 Q20 19 32 14 M8 20 Q20 25 32 20 M8 26 Q20 31 32 26 M8 32 Q20 37 32 32"
          stroke="#5c6bc0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Helix strand B -->
    <path d="M8 8 Q20 3 32 8 M8 14 Q20 9 32 14 M8 20 Q20 15 32 20 M8 26 Q20 21 32 26 M8 32 Q20 27 32 32"
          stroke="#26c6da" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Node dots -->
    <circle cx="8" cy="8" r="2.2" fill="#5c6bc0"/>
    <circle cx="32" cy="8" r="2.2" fill="#26c6da"/>
    <circle cx="8" cy="20" r="2.2" fill="#5c6bc0"/>
    <circle cx="32" cy="20" r="2.2" fill="#26c6da"/>
    <circle cx="8" cy="32" r="2.2" fill="#5c6bc0"/>
    <circle cx="32" cy="32" r="2.2" fill="#26c6da"/>
  </g>
  <!-- Text: "Awesome Bioinfo" in two weights -->
  <text x="50" y="17" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" letter-spacing="0.05em"
        fill="#6b7280" text-rendering="geometricPrecision">AWESOME</text>
  <text x="50" y="33" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="-0.02em"
        fill="#1a1f3a" text-rendering="geometricPrecision">Bioinformatics Algorithms</text>
</svg>
