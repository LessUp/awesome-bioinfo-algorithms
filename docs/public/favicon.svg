<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c6bc0"/>
      <stop offset="100%" stop-color="#26c6da"/>
    </linearGradient>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1a1d2e; }
        .strand { stroke: #7986cb; }
        .node-dot { fill: #26c6da; }
      }
    </style>
  </defs>
  <!-- Background square with rounded corners -->
  <rect class="bg" width="32" height="32" rx="6" fill="#ffffff"/>
  <!-- Gradient overlay -->
  <rect width="32" height="32" rx="6" fill="url(#g1)" opacity="0.15"/>
  <!-- DNA double helix strands -->
  <path class="strand" d="M8 6 Q16 10 24 6 M8 11 Q16 15 24 11 M8 16 Q16 20 24 16 M8 21 Q16 25 24 21 M8 26 Q16 30 24 26"
        stroke="#5c6bc0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path class="strand" d="M8 6 Q16 2 24 6 M8 11 Q16 7 24 11 M8 16 Q16 12 24 16 M8 21 Q16 17 24 21 M8 26 Q16 22 24 26"
        stroke="#26c6da" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Base pair nodes -->
  <circle class="node-dot" cx="8" cy="6" r="2" fill="#5c6bc0"/>
  <circle class="node-dot" cx="24" cy="6" r="2" fill="#26c6da"/>
  <circle class="node-dot" cx="8" cy="16" r="2" fill="#5c6bc0"/>
  <circle class="node-dot" cx="24" cy="16" r="2" fill="#26c6da"/>
  <circle class="node-dot" cx="8" cy="26" r="2" fill="#5c6bc0"/>
  <circle class="node-dot" cx="24" cy="26" r="2" fill="#26c6da"/>
</svg>
