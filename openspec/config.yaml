# OpenSpec Configuration
# https://github.com/Fission-AI/OpenSpec

# Required: Workflow schema to use
schema: spec-driven

# Optional: Project context injected into artifact instructions (max 50KB)
context: |
  Project: Awesome Bioinformatics Algorithms
  Description: A curated collection of bioinformatics algorithms with automated tooling

  Tech Stack:
  - Language: Python 3.9-3.12
  - Data Format: YAML (human-readable, machine-accessible)
  - Testing: pytest + Hypothesis (property-based testing)
  - Documentation: MkDocs with Material theme (sole public docs surface)
  - Quality: Ruff (linting/formatting), mypy (type checking), pre-commit hooks
  - CI: GitHub Actions (multi-version testing, coverage >85%)

  Requirements Source of Truth: openspec/specs/ (living specifications)
  Legacy Jekyll docs/ has been removed; openspec/ and mkdocs/ are authoritative.

  CLI Entry Point: python -m awesome_bioinfo <command>

  Supported Commands (exhaustive list):
  - validate: Validate all YAML data against schema
  - stats: Display collection statistics (text output only, no --format flag)
  - search: Search algorithms by name, category, tags, difficulty
  - info: Display detailed algorithm information (text output only, no --format flag)
  - compare: Compare exactly two algorithms side-by-side (id1 id2 only)
  - export: Export data in JSON or CSV format (no YAML export, no --category filter)
  - generate: Generate README.md from templates (no --lang flag; Chinese README is manual)
  - mkdocs: Generate MkDocs documentation site files in mkdocs/docs/
  - check-links: Check validity of algorithm URLs

  There are NO global -v/--verbose or -q/--quiet flags.

  Data Structure:
  - data/categories.yaml: 16 categories with hierarchical subcategories
  - data/algorithms/*.yaml: Algorithm entries (one file per category)
  - schemas/algorithm-schema.json: JSON Schema for validation
  - templates/: YAML templates for new entries

  Constraints:
  - No external dependencies for core CLI (stdlib + PyYAML only)
  - Python 3.9-3.12 compatibility required
  - Deterministic generation for CI diff checks
  - Bilingual support: Chinese primary in data, English secondary fields optional
  - README.zh-CN.md is a manually maintained Chinese portal (NOT auto-generated)
  - Description length: 50-500 characters
  - Algorithm IDs: lowercase, hyphenated, globally unique

  Generated Outputs (do not hand-edit):
  - README.md — via python -m awesome_bioinfo generate
  - mkdocs/docs/ — via python -m awesome_bioinfo mkdocs

# Optional: Rules mapped to artifact IDs
rules:
  proposal:
    - Include affected algorithm categories if relevant
    - Check if data schema changes are needed
    - Update tests if behavior changes
    - Consider anti-drift: update specs before or with implementation

  specs:
    - Use GIVEN/WHEN/THEN format for scenarios
    - Reference existing patterns before inventing new ones
    - Consider both success and error scenarios
    - Include validation requirements
    - Do NOT spec features that are not in the implementation unless the change explicitly adds them

  design:
    - Consider Python 3.9 compatibility
    - Avoid external dependencies for core functionality
    - Ensure deterministic output for generators
    - Keep CLI lean: no new flags without a clear use case

  tasks:
    - Include validation command to run after changes
    - Specify if README/mkdocs regeneration needed
    - Add tests for new functionality
    - Run linting and type checking
