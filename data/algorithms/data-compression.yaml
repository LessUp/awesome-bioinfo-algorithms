algorithms:
  - id: gzip-fastq
    name: GZIP for FASTQ
    description: |
      基于 DEFLATE 算法的通用数据压缩方法，广泛用于压缩 FASTQ 格式的测序数据。
      该方法压缩比适中，兼容性好，是生物信息学数据存储的标准压缩格式。
    purpose: 测序数据的通用压缩
    time_complexity: O(n)
    space_complexity: O(1)
    year: 1992
    category: data-compression
    subcategory: general-compression
    paper_url: https://doi.org/10.17487/RFC1952
    related_tools:
      - gzip
      - pigz
      - bgzip
    tags:
      - lossless
      - general-purpose
      - standard
      - fastq

  - id: cram
    name: CRAM
    description: |
      专为比对数据设计的参考序列压缩格式，通过存储与参考序列的差异实现高压缩比。
      该方法可将 BAM 文件压缩至原大小的 40-60%，是大规模测序项目的首选存储格式。
    purpose: 比对数据的高效压缩存储
    time_complexity: O(n)
    space_complexity: O(r)
    year: 2011
    category: data-compression
    subcategory: specialized-compression
    paper_url: https://doi.org/10.1093/nar/gkq1373
    implementation_url: https://github.com/samtools/htslib
    related_tools:
      - samtools
      - htslib
      - cramtools
    tags:
      - reference-based
      - alignment
      - bam
      - efficient

  - id: genozip
    name: Genozip
    description: |
      专为基因组数据设计的高性能压缩工具，支持 FASTQ、BAM、VCF 等多种格式的无损压缩。
      该方法利用基因组数据的特殊结构实现远超通用压缩的压缩比，支持随机访问和加密。
    purpose: 基因组数据的高压缩比无损压缩
    time_complexity: O(n)
    space_complexity: O(1)
    year: 2021
    category: data-compression
    subcategory: specialized-compression
    paper_url: https://doi.org/10.1093/bioinformatics/btab102
    implementation_url: https://github.com/divonlan/genozip
    related_tools:
      - gzip
      - CRAM
      - Spring
    tags:
      - multi-format
      - high-ratio
      - random-access
      - encryption
