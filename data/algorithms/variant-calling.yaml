algorithms:
  - id: gatk-haplotypecaller
    name: GATK HaplotypeCaller
    description: |
      基于局部重组装的变异检测算法，通过在活跃区域进行局部单倍型组装来发现变异。
      该方法能够同时检测 SNP 和 Indel，是目前最广泛使用的变异检测工具之一。
    purpose: 检测 SNP 和小型 Indel 变异
    time_complexity: O(n * r)
    space_complexity: O(r)
    year: 2010
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1038/ng.806
    implementation_url: https://github.com/broadinstitute/gatk
    related_tools:
      - GATK
      - Picard
      - BWA
    tags:
      - haplotype
      - snp
      - indel
      - germline

  - id: deepvariant
    name: DeepVariant
    description: |
      基于深度学习的变异检测工具，将比对数据转化为图像后使用卷积神经网络进行变异分类。
      该方法在多个基准测试中表现优异，能有效降低假阳性率，支持多种测序平台数据。
    purpose: 基于深度学习的高精度变异检测
    time_complexity: O(n * r)
    space_complexity: O(r)
    year: 2018
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1038/nbt.4235
    implementation_url: https://github.com/google/deepvariant
    related_tools:
      - GATK
      - PEPPER-Margin-DeepVariant
      - Clair3
    tags:
      - deep-learning
      - cnn
      - snp
      - high-accuracy

  - id: freebayes
    name: FreeBayes
    description: |
      基于贝叶斯统计的变异检测算法，使用单倍型作为基本单位进行变异调用。
      该方法支持多倍体样本，能够检测复杂的变异模式，计算效率较高。
    purpose: 基于贝叶斯的变异检测
    time_complexity: O(n * h)
    space_complexity: O(h)
    year: 2012
    category: variant-calling
    subcategory: snv
    paper_url: https://arxiv.org/abs/1207.3907
    implementation_url: https://github.com/freebayes/freebayes
    related_tools:
      - VCFtools
      - BCFtools
    tags:
      - bayesian
      - haplotype
      - polyploid
      - snp

  - id: strelka2
    name: Strelka2
    description: |
      快速准确的体细胞和生殖系小型变异检测工具，使用分层混合模型提高检测灵敏度。
      该方法速度极快，能在数小时内完成全基因组变异检测，广泛用于癌症基因组学研究。
    purpose: 快速体细胞和生殖系变异检测
    time_complexity: O(n * r)
    space_complexity: O(r)
    year: 2018
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1038/s41592-018-0051-x
    implementation_url: https://github.com/Illumina/strelka
    related_tools:
      - Mutect2
      - VarScan2
      - GATK
    tags:
      - somatic
      - germline
      - fast
      - clinical

  - id: delly
    name: Delly
    description: |
      基于分裂读段和双端读段信号的结构变异检测算法，能够发现缺失、重复、倒位和易位等大规模基因组变异。
      该方法结合多种信号源提高检测灵敏度，是结构变异检测领域的代表性工具之一。
    purpose: 检测基因组结构变异（缺失、重复、倒位、易位）
    time_complexity: O(n * c)
    space_complexity: O(n)
    year: 2012
    category: variant-calling
    subcategory: structural
    paper_url: https://doi.org/10.1093/bioinformatics/bts378
    implementation_url: https://github.com/dellytools/delly
    related_tools:
      - Manta
      - LUMPY
      - GRIDSS
    tags:
      - structural-variant
      - split-read
      - paired-end
      - sv-detection

  - id: manta
    name: Manta
    description: |
      高性能的结构变异和大型 Indel 检测工具，使用图组装方法精确定位变异断点。
      该方法速度快、准确性高，支持体细胞和生殖系变异检测，广泛用于临床基因组学。
    purpose: 结构变异和大型 Indel 检测
    time_complexity: O(n * c)
    space_complexity: O(c)
    year: 2016
    category: variant-calling
    subcategory: structural
    paper_url: https://doi.org/10.1093/bioinformatics/btv710
    implementation_url: https://github.com/Illumina/manta
    related_tools:
      - Delly
      - GRIDSS
      - SvABA
    tags:
      - structural-variant
      - graph-assembly
      - clinical
      - fast

  - id: sniffles2
    name: Sniffles2
    description: |
      面向长读段测序数据的结构变异检测工具，结合断点信号和覆盖度变化识别插入、缺失、倒位等复杂事件。
      该方法对 PacBio 和 ONT 数据均有良好表现，适合群体水平与单样本的长读段结构变异分析。
    purpose: 基于长读段数据进行高精度结构变异检测
    time_complexity: O(n * c)
    space_complexity: O(n)
    year: 2023
    category: variant-calling
    subcategory: structural
    paper_url: https://doi.org/10.1038/s41587-023-02024-y
    implementation_url: https://github.com/fritzsedlazeck/Sniffles
    related_tools:
      - Delly
      - Manta
      - cuteSV
    tags:
      - structural-variant
      - long-read
      - breakpoint
      - population-scale

  - id: mutect2
    name: MuTect2
    description: |
      GATK 中的体细胞变异检测工具，通过贝叶斯统计模型同时检测肿瘤样本中的体细胞 SNP 和小型 Indel。
      该方法利用匹配的正常组织样本进行背景噪声去除，广泛应用于癌症基因组学研究与临床肿瘤检测。
    purpose: 检测体细胞 SNP 和小型 Indel 变异
    time_complexity: O(n * r)
    space_complexity: O(r)
    year: 2013
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1101/861054
    implementation_url: https://github.com/broadinstitute/gatk
    related_tools:
      - GATK
      - Strelka2
      - VarScan2
    tags:
      - somatic
      - cancer
      - gatk
      - snp

  - id: clair3
    name: Clair3
    description: |
      面向长读段测序数据的生殖系小型变异检测工具，结合堆叠图像和全比对两阶段深度学习模型进行变异分类。
      该方法对 Nanopore 和 PacBio 数据均有出色表现，具有极高的准确率和良好的计算效率。
    purpose: 基于长读段数据进行高精度生殖系变异检测
    time_complexity: O(n * r)
    space_complexity: O(r)
    year: 2022
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1038/s43588-022-00387-x
    implementation_url: https://github.com/HKU-BAL/Clair3
    related_tools:
      - DeepVariant
      - PEPPER-Margin-DeepVariant
      - Medaka
    tags:
      - long-read
      - nanopore
      - pacbio
      - germline

  - id: deep-somatic
    name: DeepSomatic
    description: |
      基于深度学习的体细胞变异检测工具，利用神经网络从长读段比对数据中识别肿瘤特异性突变。
      该方法支持多种测序平台，能够检测复杂突变模式，适用于癌症基因组研究中的高灵敏度变异发现。
    purpose: 基于深度学习的体细胞变异检测
    time_complexity: O(n * r)
    space_complexity: O(r)
    year: 2024
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1038/s41587-025-02839-x
    implementation_url: https://github.com/google/deepsomatic
    related_tools:
      - MuTect2
      - DeepVariant
      - Strelka2
    tags:
      - deep-learning
      - somatic
      - cancer
      - long-read

  - id: octopus
    name: Octopus
    description: |
      基于贝叶斯统计框架的单倍型感知变异检测工具，能够同时对生殖系和体细胞变异进行联合建模与推断。
      该方法支持多样本联合分析，具有极高的变异检测灵敏度和特异性，适用于复杂基因组研究。
    purpose: 贝叶斯单倍型感知的变异检测与联合推断
    time_complexity: O(n * h)
    space_complexity: O(h)
    year: 2021
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1038/s41587-021-00861-3
    implementation_url: https://github.com/luntergroup/octopus
    related_tools:
      - FreeBayes
      - GATK HaplotypeCaller
      - Strelka2
    tags:
      - bayesian
      - haplotype
      - germline-somatic
      - multi-sample

  - id: gridss
    name: GRIDSS
    description: |
      基于断裂端组装的基因组重排识别算法，通过局部组装和 split-read 信号精确定位结构变异断点。
      该方法具有极高的灵敏度和特异性，能够检测复杂结构变异事件，是结构变异检测领域的重要工具。
    purpose: 基于断裂端组装检测基因组结构变异
    time_complexity: O(n * c)
    space_complexity: O(n)
    year: 2017
    category: variant-calling
    subcategory: structural
    paper_url: https://doi.org/10.1101/gr.222109.117
    implementation_url: https://github.com/PapenfussLab/gridss
    related_tools:
      - Delly
      - Manta
      - LUMPY
    tags:
      - structural-variant
      - breakend
      - assembly-based

  - id: cutesv
    name: cuteSV
    description: |
      面向长读段测序数据的结构变异检测工具，通过对不同变异类型信号的聚类分析识别基因组变异。
      该方法对插入、缺失、倒位和易位等变异类型均有良好检测效果，适用于 Nanopore 和 PacBio 数据分析。
    purpose: 基于长读段数据通过信号聚类检测结构变异
    time_complexity: O(n * c)
    space_complexity: O(n)
    year: 2020
    category: variant-calling
    subcategory: structural
    paper_url: https://doi.org/10.1186/s13059-020-02107-y
    implementation_url: https://github.com/tjiangHIT/cuteSV
    related_tools:
      - Sniffles2
      - Delly
      - Manta
    tags:
      - structural-variant
      - long-read
      - clustering
      - nanopore

  - id: svaba
    name: SvABA
    description: |
      基于局部组装的结构变异和体细胞突变检测工具，能够同时识别生殖系和体细胞的结构变异事件。
      该方法通过断点图和单倍型组装精确定位变异断点，适用于癌症基因组学中的复杂变异检测。
    purpose: 基于局部组装的结构变异和体细胞突变检测
    time_complexity: O(n * c)
    space_complexity: O(c)
    year: 2016
    category: variant-calling
    subcategory: structural
    paper_url: https://doi.org/10.1101/gr.221028.117
    implementation_url: https://github.com/walaj/svaba
    related_tools:
      - Manta
      - GRIDSS
      - Delly
    tags:
      - structural-variant
      - somatic
      - assembly-based
