algorithms:
  - id: gatk-haplotypecaller
    name: GATK HaplotypeCaller
    description: |
      基于局部重组装的变异检测算法，通过在活跃区域进行局部单倍型组装来发现变异。
      该方法能够同时检测 SNP 和 Indel，是目前最广泛使用的变异检测工具之一。
    purpose: 检测 SNP 和小型 Indel 变异
    time_complexity: O(n * r)
    space_complexity: O(r)
    year: 2010
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1038/ng.806
    implementation_url: https://github.com/broadinstitute/gatk
    related_tools:
      - GATK
      - Picard
      - BWA
    tags:
      - haplotype
      - snp
      - indel
      - germline

  - id: deepvariant
    name: DeepVariant
    description: |
      基于深度学习的变异检测工具，将比对数据转化为图像后使用卷积神经网络进行变异分类。
      该方法在多个基准测试中表现优异，能有效降低假阳性率，支持多种测序平台数据。
    purpose: 基于深度学习的高精度变异检测
    time_complexity: O(n * r)
    space_complexity: O(r)
    year: 2018
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1038/nbt.4235
    implementation_url: https://github.com/google/deepvariant
    related_tools:
      - GATK
      - PEPPER-Margin-DeepVariant
      - Clair3
    tags:
      - deep-learning
      - cnn
      - snp
      - high-accuracy

  - id: freebayes
    name: FreeBayes
    description: |
      基于贝叶斯统计的变异检测算法，使用单倍型作为基本单位进行变异调用。
      该方法支持多倍体样本，能够检测复杂的变异模式，计算效率较高。
    purpose: 基于贝叶斯的变异检测
    time_complexity: O(n * h)
    space_complexity: O(h)
    year: 2012
    category: variant-calling
    subcategory: snv
    paper_url: https://arxiv.org/abs/1207.3907
    implementation_url: https://github.com/freebayes/freebayes
    related_tools:
      - VCFtools
      - BCFtools
    tags:
      - bayesian
      - haplotype
      - polyploid
      - snp

  - id: strelka2
    name: Strelka2
    description: |
      快速准确的体细胞和生殖系小型变异检测工具，使用分层混合模型提高检测灵敏度。
      该方法速度极快，能在数小时内完成全基因组变异检测，广泛用于癌症基因组学研究。
    purpose: 快速体细胞和生殖系变异检测
    time_complexity: O(n * r)
    space_complexity: O(r)
    year: 2018
    category: variant-calling
    subcategory: snv
    paper_url: https://doi.org/10.1038/s41592-018-0051-x
    implementation_url: https://github.com/Illumina/strelka
    related_tools:
      - Mutect2
      - VarScan2
      - GATK
    tags:
      - somatic
      - germline
      - fast
      - clinical

  - id: delly
    name: Delly
    description: |
      基于分裂读段和双端读段信号的结构变异检测算法，能够发现缺失、重复、倒位和易位等大规模基因组变异。
      该方法结合多种信号源提高检测灵敏度，是结构变异检测领域的代表性工具之一。
    purpose: 检测基因组结构变异（缺失、重复、倒位、易位）
    time_complexity: O(n * c)
    space_complexity: O(n)
    year: 2012
    category: variant-calling
    subcategory: structural
    paper_url: https://doi.org/10.1093/bioinformatics/bts378
    implementation_url: https://github.com/dellytools/delly
    related_tools:
      - Manta
      - LUMPY
      - GRIDSS
    tags:
      - structural-variant
      - split-read
      - paired-end
      - sv-detection

  - id: manta
    name: Manta
    description: |
      高性能的结构变异和大型 Indel 检测工具，使用图组装方法精确定位变异断点。
      该方法速度快、准确性高，支持体细胞和生殖系变异检测，广泛用于临床基因组学。
    purpose: 结构变异和大型 Indel 检测
    time_complexity: O(n * c)
    space_complexity: O(c)
    year: 2016
    category: variant-calling
    subcategory: structural
    paper_url: https://doi.org/10.1093/bioinformatics/btv710
    implementation_url: https://github.com/Illumina/manta
    related_tools:
      - Delly
      - GRIDSS
      - SvABA
    tags:
      - structural-variant
      - graph-assembly
      - clinical
      - fast
