site_name: Awesome Bioinformatics Algorithms
site_url: https://lessup.github.io/awesome-bioinfo-algorithms/
site_description: "生物信息学算法概要汇总 | A curated list of bioinformatics algorithms"
site_author: LessUp

repo_url: https://github.com/LessUp/awesome-bioinfo-algorithms
repo_name: awesome-bioinfo-algorithms

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 检索: search.md
  - 标签: tags.md
  - 分类:
    - 分类总览: categories/index.md
  - 算法:
    - 全部算法: algorithms/index.md
  - 指南:
    - API 文档: api.md
    - 常见问题: faq.md
    - 开发指南: development.md
    - 贡献指南: contributing.md
  - 项目:
    - 关于项目: about.md
    - 变更日志: changelog.md
    - 行为准则: code-of-conduct.md
    - 安全指南: security.md
    - 安全策略: security-policy.md
