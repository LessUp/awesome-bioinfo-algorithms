# =============================================================================
# Awesome Bioinformatics Algorithms - MkDocs Configuration
# =============================================================================
# Modern, bilingual documentation site configuration
# Theme: BioTech Horizon - Deep tech blue with bio-green accents
# =============================================================================

site_name: Awesome Bioinformatics Algorithms
site_url: https://shane.github.io/awesome-bioinfo-algorithms/
site_description: >
  A curated collection of 200+ bioinformatics algorithms with complexity analysis,
  implementation links, and comprehensive documentation in English and Chinese.
site_author: Awesome Bioinfo Community
copyright: >
  Copyright &copy; 2025-2026 Awesome Bioinfo Community.
  Released under CC0 1.0 Universal (Public Domain).

# Repository configuration
repo_url: https://github.com/shane/awesome-bioinfo-algorithms
repo_name: shane/awesome-bioinfo-algorithms
edit_uri: edit/main/mkdocs/docs/

# ---------------------------------------------------------------------------
# Theme Configuration - Material for MkDocs
# ---------------------------------------------------------------------------
theme:
  name: material
  language: zh
  custom_dir: overrides
  
  # Color palette - BioTech Horizon theme
  palette:
    # Light mode - Clean scientific
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode | 切换到深色模式
    # Dark mode - Deep tech
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode | 切换到浅色模式
  
  # Typography - Modern scientific
  font:
    text: Inter
    code: JetBrains Mono
  
  # Icons
  icon:
    logo: material/dna
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  
  # Favicon
  favicon: assets/favicon.png
  
  # Features - optimized for performance and UX
  features:
    # Navigation
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    
    # Table of contents
    - toc.follow
    - toc.integrate
    
    # Search
    - search.suggest
    - search.highlight
    - search.share
    
    # Content
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - content.action.edit
    - content.action.view

# ---------------------------------------------------------------------------
# Plugins - Core only
# ---------------------------------------------------------------------------
plugins:
  # Built-in search
  - search:
      separator: '[\s\-\.]+'
      lang:
        - zh
        - en

# ---------------------------------------------------------------------------
# Markdown Extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  # Python Markdown
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Anchor link
      toc_depth: 4
  - tables
  
  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ---------------------------------------------------------------------------
# Extra CSS & JavaScript
# ---------------------------------------------------------------------------
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/extra.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js

# ---------------------------------------------------------------------------
# Extra Configuration - Bilingual Support
# ---------------------------------------------------------------------------
extra:
  # Language alternatives
  alternate:
    - name: 🇨🇳 简体中文
      link: /
      lang: zh
    - name: 🇺🇸 English
      link: /en/
      lang: en
  
  # Social links
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shane/awesome-bioinfo-algorithms
      name: GitHub Repository
    - icon: material/rss-box
      link: /feed_rss_created.xml
      name: RSS Feed
    - icon: material/star
      link: https://github.com/shane/awesome-bioinfo-algorithms/stargazers
      name: Star us on GitHub
  
  # Status indicators
  status:
    new: Recently added
    updated: Recently updated
    new_zh: 最近添加
    updated_zh: 最近更新
  
  # Site metadata
  version: 2.0.0
  release_date: 2025-01
  
  # Generator disabled for cleaner output
  generator: false

# ---------------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------------
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# ---------------------------------------------------------------------------
# Watch paths (for development)
# ---------------------------------------------------------------------------
watch:
  - ../data
  - ../awesome_bioinfo

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------

nav:
  - 首页: index.md
  - 算法:
    - 全部算法: algorithms/index.md
  - 分类:
    - 分类总览: categories/index.md
    - 序列比对: categories/sequence-alignment.md
    - 序列组装: categories/assembly.md
    - 变异检测: categories/variant-calling.md
    - 基因表达分析: categories/expression-analysis.md
    - 蛋白质结构预测: categories/protein-structure.md
    - 系统发育分析: categories/phylogenetics.md
    - 功能注释: categories/functional-annotation.md
    - 数据压缩: categories/data-compression.md
    - 单细胞基因组学: categories/single-cell.md
    - 宏基因组学: categories/metagenomics.md
    - 表观基因组学: categories/epigenomics.md
    - 基因预测: categories/gene-prediction.md
    - 群体遗传学: categories/population-genetics.md
    - 空间组学: categories/spatial-omics.md
    - 图基因组学: categories/graph-genomics.md
    - 蛋白质语言模型: categories/protein-language-model.md
  - 标签: tags.md
