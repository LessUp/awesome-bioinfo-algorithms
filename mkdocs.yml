# =============================================================================
# AWESOME BIOINFORMATICS ALGORITHMS - PREMIUM MKDOCS CONFIGURATION
# =============================================================================
# This is the ULTIMATE MkDocs configuration with all Material theme features
# enabled for maximum functionality and aesthetics.
# =============================================================================

site_name: Awesome Bioinformatics Algorithms
site_url: https://lessup.github.io/awesome-bioinfo-algorithms/
site_description: >
  A curated collection of 200+ bioinformatics algorithms with complexity analysis,
  implementation links, and comprehensive documentation in English and Chinese.
site_author: LessUp Community
copyright: >
  Copyright &copy; 2025-2026 LessUp Community. 
  Released under CC0 1.0 Universal (Public Domain).

# =============================================================================
# REPOSITORY CONFIGURATION
# =============================================================================
repo_url: https://github.com/LessUp/awesome-bioinfo-algorithms
repo_name: LessUp/awesome-bioinfo-algorithms
edit_uri: edit/main/docs/

# =============================================================================
# THEME CONFIGURATION - MATERIAL DESIGN 3
# =============================================================================
theme:
  name: material
  custom_dir: overrides
  
  # Color Palette - Dynamic with Light/Dark/Auto modes
  palette:
    # Light Mode (Default)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Typography - Premium fonts
  font:
    text: Inter
    code: JetBrains Mono
  
  # Icons and Logo
  icon:
    logo: material/dna
    repo: fontawesome/brands/github
    favicon: material/dna
  
  # =============================================================================
  # FEATURES - EVERYTHING ENABLED FOR MAXIMUM POWER
  # =============================================================================
  features:
    # Navigation
    - navigation.instant              # Instant loading
    - navigation.instant.prefetch     # Prefetch links
    - navigation.instant.progress     # Progress indicator
    - navigation.tabs                 # Top-level tabs
    - navigation.tabs.sticky          # Sticky tabs
    - navigation.sections             # Collapsible sections
    - navigation.path                 # Breadcrumb path
    - navigation.indexes              # Section index pages
    - navigation.top                  # Back-to-top button
    - navigation.footer               # Previous/Next footer
    - navigation.tracking             # URL anchor tracking
    - navigation.prune                # Prune navigation
    
    # Search
    - search.suggest                  # Search suggestions
    - search.highlight                # Highlight search results
    - search.share                    # Share search queries
    
    # Content
    - content.code.copy               # Copy code blocks
    - content.code.select             # Select code blocks
    - content.code.annotate           # Code annotations
    - content.tooltips                # Rich tooltips
    - content.tabs.link               # Linked tabs
    - content.footnote.tooltips       # Footnote previews
    
    # Header
    - header.autohide                 # Auto-hide header
    - header.autohide.immediate       # Immediate hide
    
    # Announcements
    - announce.dismiss                # Dismissible announcements

# =============================================================================
# PLUGINS - MAXIMUM FUNCTIONALITY
# =============================================================================
plugins:
  # Search plugin with stemmer support
  - search:
      separator: '[\s\-_,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;|(?<!\w)\.\.(\.(?!\w))'
      lang:
        - zh
        - en
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer
  
  # Minification for production
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true
  
  # Git revision integration
  - git-revision-date-localized:
      type: datetime
      enable_creation_date: true
      fallback_to_build_date: true
      exclude:
        - index.md
  
  # Git contributors
  - git-committers:
      repository: LessUp/awesome-bioinfo-algorithms
      branch: main
      exclude:
        - index.md
  
  # Social cards for sharing
  - social:
      enabled: !ENV [CI, false]
      cards: true
      cards_layout: default
      cards_layout_options:
        background_color: "#1a1a2e"
        background_image: null
        color: "#ffffff"
        font_family: Inter
  
  # Privacy-focused external links
  - privacy:
      enabled: !ENV [CI, false]
      externals: bundle
      externals_dir: assets/externals
      assets: true
      assets_dir: assets
  
  # Blog/Changelog support
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: full
      post_excerpt: optional
      post_excerpt_separator: <!-- more -->
      post_readtime: true
      post_readtime_words_per_minute: 265
      archive: true
      archive_date_format: yyyy
      archive_url_format: archive/{date}.md
      categories: true
      categories_url_format: category/{slug}.md
      pagination: true
      pagination_per_page: 10
      pagination_url_format: page/{page}.md

# =============================================================================
# MARKDOWN EXTENSIONS - FULL POWER
# =============================================================================
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
      title: On this page
  - tables
  
  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: LessUp
      repo: awesome-bioinfo-algorithms
  - pymdownx.mark
  - pymdownx.progressbar
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# EXTRA CSS & JAVASCRIPT - CUSTOM STYLING & INTERACTIVITY
# =============================================================================
extra_css:
  - stylesheets/extra.css
  - stylesheets/animations.css
  - stylesheets/custom-admonitions.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/animations.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js

# =============================================================================
# EXTRA DATA - SITE-WIDE VARIABLES
# =============================================================================
extra:
  # Social links
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LessUp/awesome-bioinfo-algorithms
      name: GitHub Repository
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/lessup
      name: Twitter / X
    - icon: fontawesome/brands/discord
      link: https://discord.gg/lessup
      name: Discord Community
    - icon: fontawesome/solid/rss
      link: /feed_rss_created.xml
      name: RSS Feed
  
  # Analytics
  analytics:
    provider: google
    property: G-XXXXXXXXXX
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback! Help us improve by 
            <a href="https://github.com/LessUp/awesome-bioinfo-algorithms/issues/new" target="_blank">opening an issue</a>.
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve by 
            <a href="https://github.com/LessUp/awesome-bioinfo-algorithms/issues/new" target="_blank">opening an issue</a>.
  
  # Versioning
  version:
    provider: mike
    default: stable
  
  # Alternate language versions
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 中文
      link: /zh/
      lang: zh
  
  # Tags (for tagging plugin)
  tags:
    file: tags.md
  
  # Generator
  generator: false
  
  # Custom properties
  project:
    algorithms: 201
    categories: 16
    tags: 399

