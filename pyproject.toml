[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-bioinfo-algorithms"
version = "1.0.3"
description = "Repository-maintenance tooling and curated bioinformatics algorithm data"
readme = "README.md"
license = {text = "CC0-1.0"}
requires-python = ">=3.9"
authors = [
    {name = "LessUp"}
]
keywords = ["bioinformatics", "algorithms", "awesome-list", "repository-tooling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "types-PyYAML>=6.0",
]
docs = [
    # MkDocs Material theme — the only plugin in use is the built-in search.
    # [imaging] is omitted: social cards are not configured in mkdocs/mkdocs.yml.
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/LessUp/awesome-bioinfo-algorithms"
Repository = "https://github.com/LessUp/awesome-bioinfo-algorithms"
Issues = "https://github.com/LessUp/awesome-bioinfo-algorithms/issues"

# This project is maintained and executed from a repository checkout.
# The Python configuration here exists to support local development,
# validation, testing, and README generation for contributors.

[tool.setuptools.packages.find]
where = ["."]
include = ["awesome_bioinfo*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
# Type checking strictness (progressive enhancement)
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
# Strict mode (gradually enable)
# strict = true
check_untyped_defs = true
# disallow_untyped_calls = true
# disallow_untyped_defs = true
# Ignore missing imports for third-party libraries without stubs
ignore_missing_imports = true
# Exclude patterns
exclude = [
    "venv/",
    ".venv/",
    "__pycache__/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["awesome_bioinfo"]
branch = true
omit = [
    "awesome_bioinfo/link_checker.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    'if __name__ == .__main__.:',
]
