name: Bug Report
about: Create a report for data errors, broken links, or tool issues
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill out the details below.

  - type: dropdown
    id: bug_type
    attributes:
      label: Bug Type
      description: What category does this bug fall into?
      options:
        - Data Error (wrong algorithm info)
        - Broken Link (paper/implementation URL)
        - Tool/Script Error
        - Documentation Error
        - CI/Build Error
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the issue...
    validations:
      required: true

  - type: input
    id: algorithm_id
    attributes:
      label: Affected Algorithm ID (if applicable)
      description: The algorithm identifier (e.g., smith-waterman)
      placeholder: e.g., smith-waterman

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what should have happened...

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Run command '...'
        3. See error

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: [e.g., Ubuntu 22.04]
        - Python version: [e.g., 3.11]
        - Project version: [e.g., 1.0.2]

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow the project's Code of Conduct
          required: true
