name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff format check
        run: ruff format --check awesome_bioinfo/ tests/

      - name: Run ruff
        run: ruff check awesome_bioinfo/ tests/

      - name: Run mypy
        run: mypy awesome_bioinfo/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/ --cov=awesome_bioinfo --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Run tests
        if: matrix.python-version != '3.11'
        run: python -m pytest tests/ -v --tb=short

  verify-repository-tools:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run CLI smoke checks
        run: |
          python -m awesome_bioinfo validate
          python -m awesome_bioinfo stats
          python -m awesome_bioinfo search smith
          python -m awesome_bioinfo info smith-waterman
          python -m awesome_bioinfo compare smith-waterman needleman-wunsch
          python -m awesome_bioinfo export --format json > /tmp/algorithms.json
          python -m awesome_bioinfo mkdocs
          python -m awesome_bioinfo generate

      - name: Verify generated outputs are up to date
        run: git diff --exit-code -- README.md mkdocs/docs/
