name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff format check
        run: ruff format --check scripts/ tests/

      - name: Run ruff
        run: ruff check scripts/ tests/

      - name: Run mypy
        run: mypy scripts/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/ --cov=scripts --cov-branch --cov-report=term-missing

      - name: Run tests
        if: matrix.python-version != '3.11'
        run: python -m pytest tests/ -v --tb=short

  verify-repository-tools:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run CLI smoke checks
        run: |
          python -m scripts validate
          python -m scripts stats
          python -m scripts search smith
          python -m scripts info smith-waterman
          python -m scripts compare smith-waterman needleman-wunsch
          python -m scripts export --format json > /tmp/algorithms.json
          python -m scripts mkdocs
          python -m scripts generate

      - name: Verify generated outputs are up to date
        run: git diff --exit-code -- README.md mkdocs/docs/
