name: Security Audit

on:
  push:
    branches: [main, master]
    paths: &audit_paths
      - '.github/workflows/security.yml'
      - 'pyproject.toml'
      - 'requirements.txt'
  pull_request:
    branches: [main, master]
    paths: *audit_paths
  schedule:
    - cron: '0 0 * * 1'  # 每周一运行
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pip-audit
          pip install -e ".[dev,docs]"

      - name: Run pip-audit
        run: pip-audit
