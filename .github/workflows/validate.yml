name: Validate and Generate README

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/**'
      - 'scripts/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run validation
      run: |
        python -c "
from scripts.validate import Validator
from scripts.category_manager import CategoryManager
from scripts.algorithm_registry import AlgorithmRegistry

# Load categories
cm = CategoryManager()
cm.load_categories('data/categories.yaml')

# Load and validate algorithms
registry = AlgorithmRegistry('data/algorithms')
registry.load_all()

validator = Validator()
all_valid = True

for algo in registry.get_all_algorithms():
    result = validator.validate_algorithm(algo.to_dict())
    if not result.is_valid:
        print(f'Invalid algorithm {algo.id}: {result.errors}')
        all_valid = False

if not all_valid:
    exit(1)
print('All algorithms validated successfully!')
"
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

  generate-readme:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate README
      run: |
        python scripts/generate_readme.py
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate README" && git push)
