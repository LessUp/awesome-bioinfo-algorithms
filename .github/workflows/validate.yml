name: Validate and Generate README

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy types-PyYAML

    - name: Run ruff
      run: ruff check scripts/

    - name: Run mypy
      run: mypy scripts/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run validation
      run: |
        python -c "
from scripts.validate import Validator
from scripts.category_manager import CategoryManager
from scripts.algorithm_registry import AlgorithmRegistry

cm = CategoryManager()
cm.load_categories('data/categories.yaml')

registry = AlgorithmRegistry('data/algorithms')
registry.load_all()

validator = Validator()
all_valid = True

for algo in registry.get_all_algorithms():
    result = validator.validate_algorithm(algo.to_dict())
    if not result.is_valid:
        print(f'Invalid algorithm {algo.id}: {result.errors}')
        all_valid = False

if not all_valid:
    exit(1)
print('All algorithms validated successfully!')
"

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ -v --tb=short --cov=scripts --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  generate-readme:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Generate README
      run: python scripts/generate_readme.py

    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate README" && git push)
