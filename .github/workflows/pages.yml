name: Deploy GitHub Pages (MkDocs)

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'mkdocs/**'
      - 'awesome_bioinfo/generate_mkdocs.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Cache MkDocs build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            mkdocs/.cache
          key: ${{ runner.os }}-mkdocs-${{ hashFiles('pyproject.toml', 'mkdocs/mkdocs.yml') }}
          restore-keys: |
            ${{ runner.os }}-mkdocs-

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mkdocs-material

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate MkDocs pages
        run: python -m awesome_bioinfo mkdocs

      - name: Build MkDocs site
        run: mkdocs build -f mkdocs/mkdocs.yml --site-dir ${{ github.workspace }}/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
